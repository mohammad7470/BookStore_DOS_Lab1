services:
  catalog:
    build: ./catalog
    ports:
      - "8081:8081"
    environment:
      CATALOG_DB_URL: jdbc:sqlite:/data/catalog.db
    volumes:
      - ./data/catalog:/data

  order:
    build: ./order
    ports:
      - "8082:8082"
    environment:
      CATALOG_URL: http://catalog:8081
      ORDER_DB_URL: jdbc:sqlite:/data/orders.db
      # Simulate order database failure
      SIMULATE_ORDER_DB_FAILURE: "false"
    volumes:
      - ./data/order:/data
    depends_on:
      - catalog

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      CATALOG_URL: http://catalog:8081
      ORDER_URL: http://order:8082
    depends_on:
      - catalog
      - order
